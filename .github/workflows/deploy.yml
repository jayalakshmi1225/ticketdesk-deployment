name: TicketDesk CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    name: Build, Test & Deploy to AWS ECS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Unit & Integration Tests
        run: |
          ./mvnw test -B

      - name: Scan for Hardcoded Secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-2

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Docker Image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ticketdesk
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_ENV

      - name: Update ECS Service
        run: |
          aws ecs update-service --cluster ticketdesk-cluster --service ticketdesk-service --force-new-deployment --region ap-south-2

      - name: Wait for ECS Service Stability
        run: |
          aws ecs wait services-stable --cluster ticketdesk-cluster --services ticketdesk-service --region ap-south-2

      - name: Run Automated Post-Deployment Smoke Test
        run: |
          ALB_URL=$(aws elbv2 describe-load-balancers --names ticketdesk-alb --region ap-south-2 --query "LoadBalancers[0].DNSName" --output text)
          echo "Testing endpoint at http://${ALB_URL}/api/health"
          curl -f -s http://${ALB_URL}/api/health | grep '"status":"UP"'
          echo "Deployment Smoke Test Passed Successfully!"
